            { title: "कोणतेही मलम किंवा क्रीम लावू नका", desc: "लोणी, टूथपेस्ट किंवा क्रीम लावू नका. यामुळे उष्णता आतच अडकते आणि संसर्ग होऊ शकतो." }

          burnsStepsSevere: [

            { title: "तातडीने रुग्णवाहिका बोलवा", desc: "गंभीर भाजल्यास त्वरित क्लिनिकल वाहतुकीची आवश्यकता असते. शारीरिक स्थितीवर लक्ष ठेवा." }
          ],
          dos: [

            "गळ्याची टाई, शर्टचे कॉलर किंवा मनगटाचे घट्ट बँड सैल करा.",
            "शांत राहा, रुग्णाशी थेट बोला आणि मदत येण्याची वेळ सांगा.",
            "स्ट्रेचरसाठी थेट मार्ग उपलब्ध करून देण्यासाठी दारासमोरील गर्दी किंवा अडथळे दूर करा."
          ],
          donts: [
            "पाणी, अन्न किंवा औषध तोंडातून देऊ नका (श्वास कोंडण्याचा धोका).",
            "आग किंवा स्फोटाचा थेट धोका असल्याशिवाय रुग्णाला हलवू नका.",
            "बेशुद्ध रुग्णाला कोणत्याही वेळी एकटे सोडू नका.",
            "भाजलेल्या जखमांवर घरगुती मलम (लोणी, कोलगेट) लावू नका."
          ]

      }
    };

    // --- CITIZEN AUTHENTICATION PORTAL (COLLABORATED SINGLE-PAGE VIEW) ---
    function CitizenAuthPortal({
      authView,
      setAuthView,
      authAlert,
      setAuthAlert,
      language,
      setLanguage,
      onAuthSuccess,
      triggerToast
    }) {
      const [submitting, setSubmitting] = useState(false);
      const [showPassword, setShowPassword] = useState(false);

      // Form state for Login
      const [loginId, setLoginId] = useState('');
      const [loginPassword, setLoginPassword] = useState('');

      // Form state for Signup
      const [signupData, setSignupData] = useState({
        fullName: '',
        citizenId: '',
        email: '',
        mobile: '',
        emergencyContact: '',
        address: '',
        password: '',
        confirmPassword: ''
      });

      // Form state for Forgot Password
      const [forgotData, setForgotData] = useState({
        citizenId: '',
        email: '',
        emergencyContact: '',
        newPassword: '',
        confirmPassword: ''
      });

      // Handle Login Form Submit
      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        setSubmitting(true);
        setAuthAlert(null);

        try {
          const body = new URLSearchParams();
          body.append('identifier', loginId);
          body.append('password', loginPassword);

          const res = await fetch('login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
              'X-Requested-With': 'XMLHttpRequest',
              'Accept': 'application/json'
            },
            body: body.toString()
          });

          const data = await res.json().catch(() => ({}));
          if (res.ok && data.success) {
            onAuthSuccess(data.user || { fullName: loginId, citizenId: loginId });
          } else {
            setAuthAlert({
              type: 'error',
              text: data.message || 'Invalid Citizen ID/Email or Password. Please try again.'
            });
          }
        } catch (err) {
          console.error("Login fetch error:", err);
          setAuthAlert({
            type: 'error',
            text: 'Unable to connect to authentication server. Please check Tomcat connection.'
          });
        } finally {
          setSubmitting(false);
        }
      };

      // Handle Signup Form Submit
      const handleSignupSubmit = async (e) => {
        e.preventDefault();
        if (signupData.password !== signupData.confirmPassword) {
          setAuthAlert({ type: 'error', text: 'Passwords do not match.' });
          return;
        }
        if (signupData.password.length < 6) {
          setAuthAlert({ type: 'error', text: 'Password must be at least 6 characters.' });
          return;
        }

        setSubmitting(true);
        setAuthAlert(null);

        try {
          const body = new URLSearchParams();
          Object.keys(signupData).forEach(k => body.append(k, signupData[k]));

          const res = await fetch('signup', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
              'X-Requested-With': 'XMLHttpRequest',
              'Accept': 'application/json'
            },
            body: body.toString()
          });

          const data = await res.json().catch(() => ({}));
          if (res.ok && data.success) {
            setAuthView('login');
            setLoginId(signupData.citizenId || signupData.email);
            setAuthAlert({
              type: 'success',
              text: 'Citizen profile enrolled successfully! Please authenticate.'
            });
            triggerToast("Account created successfully. Please login.", "success");
          } else {
            setAuthAlert({
              type: 'error',
              text: data.message || 'Registration failed. Please check your information.'
            });
          }
        } catch (err) {
          console.error("Signup error:", err);
          setAuthAlert({ type: 'error', text: 'Network error occurred during registration.' });
        } finally {
          setSubmitting(false);
        }
      };

      // Handle Forgot Password Submit
      const handleForgotSubmit = async (e) => {
        e.preventDefault();
        if (forgotData.newPassword !== forgotData.confirmPassword) {
          setAuthAlert({ type: 'error', text: 'Passwords do not match.' });
          return;
        }
        if (forgotData.newPassword.length < 6) {
          setAuthAlert({ type: 'error', text: 'Password must be at least 6 characters.' });
          return;
        }

        setSubmitting(true);
        setAuthAlert(null);

        try {
          const body = new URLSearchParams();
          Object.keys(forgotData).forEach(k => body.append(k, forgotData[k]));

          const res = await fetch('forgot-password', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
              'X-Requested-With': 'XMLHttpRequest',
              'Accept': 'application/json'
            },
            body: body.toString()
          });

          const data = await res.json().catch(() => ({}));
          if (res.ok && data.success) {
            setAuthView('login');
            setLoginId(forgotData.citizenId || forgotData.email);
            setAuthAlert({
              type: 'success',
              text: 'Password updated successfully! Please login with your new credentials.'
            });
            triggerToast("Password reset successfully. Please login.", "success");
          } else {
            setAuthAlert({
              type: 'error',
              text: data.message || 'Identity verification failed. Please check your registered details.'
            });
          }
        } catch (err) {
          console.error("Forgot password error:", err);
          setAuthAlert({ type: 'error', text: 'Network error occurred during password reset.' });
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between selection:bg-accent selection:text-white font-sans antialiased relative overflow-x-hidden">
          {/* Ambient Subtle Glows */}
          <div className="fixed inset-0 pointer-events-none overflow-hidden -z-10">
            <div className="absolute -top-40 -left-40 w-96 h-96 bg-orange-200/40 rounded-full blur-3xl"></div>
            <div className="absolute top-1/2 -right-40 w-96 h-96 bg-blue-200/30 rounded-full blur-3xl"></div>
            <div className="absolute -bottom-20 left-1/3 w-80 h-80 bg-red-100/30 rounded-full blur-3xl"></div>
          </div>

          {/* Sticky Header */}
          <header className="w-full border-b border-slate-200 bg-white/95 backdrop-blur-md px-6 py-4 flex items-center justify-between sticky top-0 z-30 shadow-xs">
            <div className="flex items-center gap-3">
              <IconHeartRoute />
              <div>
                <h1 className="font-extrabold text-lg tracking-wider text-slate-900">PULSEROUTE</h1>
                <p className="text-[10px] text-accent font-bold tracking-widest uppercase">AI Emergency Net</p>
              </div>
            </div>
            <div className="flex items-center gap-4">
              <div className="flex items-center gap-2">
                <span className="text-xs font-bold text-slate-500 hidden sm:inline">🌐 Language:</span>
                <select
                  value={language}
                  onChange={(e) => setLanguage(e.target.value)}
                  className="bg-slate-50 border border-slate-300 rounded-lg py-1 px-2.5 text-xs font-bold text-slate-700 focus:outline-none focus:border-accent cursor-pointer"
                >
                  <option value="en">🇬🇧 English</option>
                  <option value="hi">🇮🇳 हिंदी (Hindi)</option>
                  <option value="mr">🇮🇳 मराठी (Marathi)</option>
                </select>
              </div>
              <div className="hidden sm:flex items-center gap-2 text-xs font-semibold bg-emerald-50 border border-emerald-200 text-emerald-700 px-3 py-1.5 rounded-full">
                <span className="h-2 w-2 rounded-full bg-emerald-600 active-pulse"></span>
                <span>Encrypted Citizen Gateway</span>
              </div>
            </div>
          </header>

          {/* Main Form Center */}
          <main className="flex-1 flex items-center justify-center p-4 sm:p-6 my-auto">
            <div className={`w-full ${authView === 'signup' ? 'max-w-2xl' : 'max-w-md'} bg-white border border-slate-200/90 rounded-3xl p-6 sm:p-8 shadow-xl relative transition-all duration-300`}>
              
              {/* Top Badge */}
              <div className="flex items-center justify-center mb-6">
                <div className="inline-flex items-center gap-2 bg-red-50 border border-red-200 text-accent px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider">
                  <span className="w-2 h-2 rounded-full bg-accent animate-ping"></span>
                  {authView === 'signup' ? 'New Citizen Node Registration' : 'Citizen Emergency SOS Portal'}
                </div>
              </div>

              {/* View Titles */}
              <div className="text-center mb-6">
                <h2 className="text-2xl font-extrabold text-slate-900 tracking-tight">
                  {authView === 'login' && 'Citizen Authentication'}
                  {authView === 'signup' && 'Enroll Citizen Profile'}
                  {authView === 'forgot' && 'Reset System Password'}
                </h2>
                <p className="text-xs text-slate-500 mt-1">
                  {authView === 'login' && 'Connect your verified telemetry node to emergency dispatchers'}
                  {authView === 'signup' && 'Create an authenticated citizen record for instant emergency dispatch'}
                  {authView === 'forgot' && 'Verify your emergency identity using your registered credentials'}
                </p>
              </div>

              {/* Dynamic Alert Box */}
              {authAlert && (
                <div className={`mb-5 p-3.5 rounded-xl text-xs font-semibold flex items-start gap-2.5 transition-all ${
                  authAlert.type === 'success' ? 'bg-emerald-50 border border-emerald-200 text-emerald-800' :
                  authAlert.type === 'error' ? 'bg-rose-50 border border-rose-200 text-rose-800' :
                  'bg-amber-50 border border-amber-200 text-amber-800'
                }`}>
                  <span className="mt-0.5 text-sm">
                    {authAlert.type === 'success' ? '✓' : authAlert.type === 'error' ? '⚠️' : 'ℹ'}
                  </span>
                  <div className="flex-1">{authAlert.text}</div>
                </div>
              )}

              {/* 1. LOGIN VIEW */}
              {authView === 'login' && (
                <form onSubmit={handleLoginSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                      Citizen ID or Registered Email
                    </label>
                    <div className="relative">
                      <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                      </div>
                      <input
                        type="text"
                        required
                        value={loginId}
                        onChange={(e) => setLoginId(e.target.value)}
                        placeholder="e.g. CIT-9901 or name@example.com"
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl pl-10 pr-4 py-3 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-accent focus:bg-white focus:ring-2 focus:ring-accent/20 transition"
                      />
                    </div>
                  </div>

                  <div>
                    <div className="flex justify-between items-center mb-1.5">
                      <label className="block text-xs font-bold uppercase tracking-wider text-slate-700">
                        System Password
                      </label>
                      <button
                        type="button"
                        onClick={() => { setAuthView('forgot'); setAuthAlert(null); }}
                        className="text-[11px] font-semibold text-accent hover:text-accentHover transition cursor-pointer"
                      >
                        Forgot Password?
                      </button>
                    </div>
                    <div className="relative">
                      <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                      </div>
                      <input
                        type={showPassword ? "text" : "password"}
                        required
                        value={loginPassword}
                        onChange={(e) => setLoginPassword(e.target.value)}
                        placeholder="Enter system password"
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl pl-10 pr-11 py-3 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-accent focus:bg-white focus:ring-2 focus:ring-accent/20 transition"
                      />
                      <button
                        type="button"
                        onClick={() => setShowPassword(!showPassword)}
                        className="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-700 transition cursor-pointer"
                        title={showPassword ? "Hide password" : "Show password"}
                      >
                        {showPassword ? (
                          <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                          </svg>
                        ) : (
                          <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                          </svg>
                        )}
                      </button>
                    </div>
                  </div>

                  <button
                    type="submit"
                    disabled={submitting}
                    className="w-full bg-accent hover:bg-accentHover active:scale-[0.99] text-white font-bold py-3.5 px-6 rounded-xl text-sm transition shadow-lg shadow-accent/25 flex items-center justify-center gap-2 cursor-pointer disabled:opacity-60"
                  >
                    {submitting ? (
                      <React.Fragment>
                        <svg className="animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24">
                          <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                          <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                        </svg>
                        <span>Authenticating...</span>
                      </React.Fragment>
                    ) : (
                      <React.Fragment>
                        <span>Authenticate & Connect</span>
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
                          <path strokeLinecap="round" strokeLinejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>
                      </React.Fragment>
                    )}
                  </button>

                  <div className="pt-4 border-t border-slate-100 text-center">
                    <p className="text-xs text-slate-500">
                      Need emergency citizen registration?{' '}
                      <button
                        type="button"
                        onClick={() => { setAuthView('signup'); setAuthAlert(null); }}
                        className="font-bold text-accent hover:text-accentHover underline ml-1 cursor-pointer"
                      >
                        Request New Citizen Access
                      </button>
                    </p>
                  </div>

                  <div className="bg-slate-50 border border-slate-200 rounded-xl p-3 text-center">
                    <span className="text-[11px] text-slate-500 block mb-1">Pre-configured Demo Credentials:</span>
                    <button
                      type="button"
                      onClick={() => {
                        setLoginId('siddhesh@test.com');
                        setLoginPassword('Password@123');
                      }}
                      className="text-xs font-mono font-bold text-emerald-700 hover:underline cursor-pointer"
                    >
                      siddhesh@test.com / Password@123 (Click to fill)
                    </button>
                  </div>

                  <div className="pt-3 border-t border-slate-100 text-center">
                    <a
                      href="hospital-login.html"
                      className="inline-flex items-center gap-1.5 text-xs font-bold text-blue-700 hover:text-blue-800 transition"
                    >
                      <span>🏥</span>
                      <span>Hospital Administrator? Access Command Center &rarr;</span>
                    </a>
                  </div>
                </form>
              )}

              {/* 2. SIGNUP VIEW */}
              {authView === 'signup' && (
                <form onSubmit={handleSignupSubmit} className="space-y-4">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">
                        Full Legal Name *
                      </label>
                      <input
                        type="text"
                        required
                        value={signupData.fullName}
                        onChange={(e) => setSignupData({ ...signupData, fullName: e.target.value })}
                        placeholder="e.g. Aditya Sharma"
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-accent focus:bg-white"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">
                        Citizen ID / UID *
                      </label>
                      <input
                        type="text"
                        required
                        value={signupData.citizenId}
                        onChange={(e) => setSignupData({ ...signupData, citizenId: e.target.value.toUpperCase() })}
                        placeholder="e.g. CIT-8800"
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-accent focus:bg-white uppercase font-mono"
                      />

    // --- MAIN APP COMPONENT ---
    function PulseRouteApp() {
      // Authentication & Single Page Application Routing
      const [isAuthenticated, setIsAuthenticated] = useState(false);

        const err = params.get('error');
        if (msg === 'registered') return { type: 'success', text: 'Account created successfully! Please authenticate.' };
        if (msg === 'logged_out') return { type: 'info', text: 'Citizen session ended successfully.' };
        if (msg === 'password_reset') return { type: 'success', text: 'Password reset successfully! Please login.' };
        if (err === 'invalid') return { type: 'error', text: 'Invalid Citizen ID/Email or Password.' };
        if (err === 'unauthorized') return { type: 'warning', text: 'Please authenticate to access the emergency portal.' };
        return null;
      });

      // Global State
      const [activeTab, setActiveTab] = useState('sos');
      const [sosState, setSosState] = useState('idle'); // idle | connecting | dispatched
      const [showAiDrawer, setShowAiDrawer] = useState(false);
      const [toasts, setToasts] = useState([]);
      const [icuBedsAvailable, setIcuBedsAvailable] = useState(3);
      const [icuPrepared, setIcuPrepared] = useState(false);

      // Citizen Session state from Servlet backend
      const [citizenUser, setCitizenUser] = useState(null);

      // SOS 3-Second Confirmation & Hospital Authorization Tracking
      const [sosCountdown, setSosCountdown] = useState(null); // null | 3 | 2 | 1
      const [pendingSosType, setPendingSosType] = useState('Ambulance');
      const [activeEmergencyRequest, setActiveEmergencyRequest] = useState(null);
      const [sosSubmitting, setSosSubmitting] = useState(false);
      const countdownTimerRef = useRef(null);

      // Check session on initial load
      useEffect(() => {
        setAuthLoading(true);
        fetch('api/session')
          .then(res => res.json())
          .then(data => {
            if (data && data.authenticated && data.user) {
              setCitizenUser(data.user);
              setIsAuthenticated(true);
            } else {
              setIsAuthenticated(false);
              setCitizenUser(null);
            }
          })
          .catch(() => {
            // If offline / dev preview, remain in auth view
            setIsAuthenticated(false);
          })
          .finally(() => {
            setAuthLoading(false);
          });
      }, []);

      const handleLogout = async () => {
        try {
          await fetch('logout', {
            headers: { 'X-Requested-With': 'XMLHttpRequest', 'Accept': 'application/json' }
          });
        } catch (e) {
          console.warn("Logout error:", e);
        }
        setIsAuthenticated(false);
        setCitizenUser(null);
        setAuthView('login');
        setAuthAlert({ type: 'info', text: 'Citizen session ended successfully.' });
        triggerToast("Citizen session ended.", "info");
      };

      // Localization & persist
      const [language, setLanguage] = useState(() => localStorage.getItem('pulseroute_lang') || 'en');
      const [dispatchedType, setDispatchedType] = useState('Ambulance'); // Ambulance | Fire Rescue | Police Support
      const [hazardReportType, setHazardReportType] = useState('Building Fire'); // Building Fire, Gas Leak, Short Circuit, Chemical Hazard
      const [womenSafetyMode, setWomenSafetyMode] = useState(false);
      const [loudEmergencyMode, setLoudEmergencyMode] = useState(false);

      // WebCam/Recording states
      const [mediaStream, setMediaStream] = useState(null);
      const [isRecording, setIsRecording] = useState(false);
      const [recordingProgress, setRecordingProgress] = useState(0);
      const videoRef = useRef(null);
      const mediaRecorderRef = useRef(null);
      const [recordedChunks, setRecordedChunks] = useState([]);

      // Translation helper function
      const t = (key) => {
        const keys = key.split('.');
        let value = TRANSLATIONS[language];
        for (const k of keys) {
          if (value && value[k] !== undefined) {
            value = value[k];
          } else {
            // Fallback to English
            let fallbackVal = TRANSLATIONS['en'];
            for (const fk of keys) {
              if (fallbackVal && fallbackVal[fk] !== undefined) {
                fallbackVal = fallbackVal[fk];
              } else {
                fallbackVal = key;
                break;
              }
            }
            return fallbackVal;
          }
        }
        return value;
      };

      // TTS Speech ref & control
      const ttsRef = useRef({
        speechUtterance: null,
        speakingStepIndex: -1,
        paused: false
      });

      const stopSpeech = () => {
        try {
          if (window.speechSynthesis) {
            window.speechSynthesis.cancel();
          }
          ttsRef.current.speakingStepIndex = -1;
          ttsRef.current.paused = false;
        } catch (e) {
          console.error(e);
        }
      };

      const speakText = (text, stepIndex = -1, onEndCallback = null) => {
        if (!window.speechSynthesis) {
          triggerToast("Text-to-Speech not supported in this browser.", "warning");
          return;
        }

        try {
          window.speechSynthesis.cancel(); // Stop any currently speaking speech

          const utterance = new SpeechSynthesisUtterance(text);
          let langLocale = 'en-US';
          if (language === 'hi') langLocale = 'hi-IN';
          if (language === 'mr') langLocale = 'mr-IN';
          utterance.lang = langLocale;
          
          const voices = window.speechSynthesis.getVoices();
          const matchedVoice = voices.find(voice => voice.lang.includes(langLocale));
          if (matchedVoice) {
            utterance.voice = matchedVoice;
          }

          utterance.volume = 1.0;
          utterance.rate = 0.9;
          utterance.pitch = 1.0;

          utterance.onstart = () => {
            ttsRef.current.speakingStepIndex = stepIndex;
            ttsRef.current.paused = false;
          };

          utterance.onend = () => {
            if (ttsRef.current.speakingStepIndex === stepIndex) {
              ttsRef.current.speakingStepIndex = -1;
            }
            if (onEndCallback) onEndCallback();
          };

          utterance.onerror = (e) => {
            console.error("TTS error:", e);
            if (ttsRef.current.speakingStepIndex === stepIndex) {
              ttsRef.current.speakingStepIndex = -1;
            }
          };

          window.speechSynthesis.speak(utterance);
          ttsRef.current.speechUtterance = utterance;
        } catch (e) {
          console.error("Speech Synthesis failed:", e);
        }
      };

      // Voice Guidance States
      const [currentReadingStep, setCurrentReadingStep] = useState(0);
      const [isSpeechPlaying, setIsSpeechPlaying] = useState(false);
      const [isSpeechPaused, setIsSpeechPaused] = useState(false);

      const triggerSirenChime = () => {
        if (!loudEmergencyMode) return Promise.resolve();
        return new Promise((resolve) => {
          try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc1 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc1.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc1.type = 'sine';
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            osc1.frequency.setValueAtTime(900, audioCtx.currentTime);
            osc1.frequency.linearRampToValueAtTime(1100, audioCtx.currentTime + 0.35);
            osc1.frequency.linearRampToValueAtTime(900, audioCtx.currentTime + 0.7);
            
            osc1.start();
            osc1.stop(audioCtx.currentTime + 0.7);
            
            setTimeout(resolve, 800);
          } catch(e) {
            resolve();
          }
        });
      };

      const handleStartSpeech = (stepIndex) => {
        setVoiceGuidance(true);
        let steps = [];
        if (firstAidActiveTab === 'cardiac') {
          steps = t('firstaid.cardiacSteps');
        } else if (firstAidActiveTab === 'bleeding') {
          steps = t('firstaid.bleedingSteps');
        } else if (firstAidActiveTab === 'burns') {
          steps = burnSeverity === 'mild' ? t('firstaid.burnsStepsMild') : t('firstaid.burnsStepsSevere');
        }

        if (stepIndex < 0 || stepIndex >= steps.length) {
          stepIndex = 0;
        }
        setCurrentReadingStep(stepIndex);

        const currentStep = steps[stepIndex];
        const stepText = `${t('firstaid.detectedCase')} ${firstAidActiveTab === 'cardiac' ? t('firstaid.cardiacArrest') : firstAidActiveTab === 'bleeding' ? t('firstaid.bleedingTab') : t('firstaid.burnsTab')}. ${language === 'en' ? 'Step' : language === 'hi' ? 'चरण' : 'पायरी'} ${stepIndex + 1}: ${currentStep.title || currentStep.step}. ${currentStep.desc || currentStep.text}`;
        
        setIsSpeechPlaying(true);
        setIsSpeechPaused(false);

        triggerSirenChime().then(() => {
          speakText(stepText, stepIndex, () => {
            setIsSpeechPlaying(false);
            if (stepIndex + 1 < steps.length) {
              setTimeout(() => {
                if (ttsRef.current.speakingStepIndex === -1 && !ttsRef.current.paused) {
                  handleStartSpeech(stepIndex + 1);
                }
              }, 3000);
            } else {
              setVoiceGuidance(false);
              triggerToast("First-aid guide audio read completed.", "success");
            }
          });
        });
      };

      const handlePauseSpeech = () => {
        if (window.speechSynthesis && window.speechSynthesis.speaking) {
          window.speechSynthesis.pause();
          ttsRef.current.paused = true;
          setIsSpeechPaused(true);
        }
      };

      const handleResumeSpeech = () => {
        if (window.speechSynthesis && window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
          ttsRef.current.paused = false;
          setIsSpeechPaused(false);
          setIsSpeechPlaying(true);
        } else {
          handleStartSpeech(currentReadingStep);
        }
      };

      const handleStopSpeech = () => {
        stopSpeech();
        setIsSpeechPlaying(false);
        setIsSpeechPaused(false);
        setVoiceGuidance(false);
      };

      // Persistence effect
      useEffect(() => {
        localStorage.setItem('pulseroute_lang', language);
      }, [language]);

      // Feature 1: AI Survival Overlay State
      const [showSurvivalOverlay, setShowSurvivalOverlay] = useState(false);

      // Feature 2: Pre-Hospital AI Guide States
      const [firstAidTime, setFirstAidTime] = useState(0);
      const [firstAidActiveTab, setFirstAidActiveTab] = useState('cardiac');
      const [voiceGuidance, setVoiceGuidance] = useState(false);
      const [burnSeverity, setBurnSeverity] = useState('mild');

      // Feature 3: Smart Ambulance Matching States
      const [matchingType, setMatchingType] = useState('cardiac');
      const [showMatchingModal, setShowMatchingModal] = useState(false);

      // Feature 4: CCTV Detection States
      const [cctvCam4Alert, setCctvCam4Alert] = useState(false);
      const [showCctvModal, setShowCctvModal] = useState(null); // camera ID or null
      const [cctvAlertElapsed, setCctvAlertElapsed] = useState({
        "CAM-001": 42,
        "CAM-003": 18,
        "CAM-005": 115,
        "CAM-004": 0
      });

      // Patient & Emergency telemetry (updated by interactions)
      const [patientVitals, setPatientVitals] = useState({
        name: "Rahul M.",
        age: 34,
        condition: "Cardiac Arrest",
        severity: "CRITICAL",
        severityScore: 87,
        eta: 6,
        spO2: 89,
        hr: 112,
        bp: "140/90",
        hospital: "Lilavati Hospital",
        route: "SV Road → Link Road → Hindmata",
        distance: 3.2,
      });

      // Quick action emergency selectors
      const [quickActionSelected, setQuickActionSelected] = useState(null);

      // Real Device GPS Geolocation State
      const [gpsLocation, setGpsLocation] = useState({
        status: 'idle', // 'idle' | 'locating' | 'acquired' | 'error'
        address: "Andheri West, Mumbai",
        coordsText: "19.1369° N, 72.8479° E • SV Road Sector 4",
        latitude: 19.1369,

        source: "Cellular Node Confirmed",
        timestamp: null,

      // Incident Media File Upload State

      const [uploadProgress, setUploadProgress] = useState(0);
      const [uploadedFile, setUploadedFile] = useState(null); // { name, size, type, previewUrl }

      // Emergency Call Authorization & Active Session State
      const [callPrompt, setCallPrompt] = useState(null); // { name, phone, type } or null
      const [activeCall, setActiveCall] = useState(null); // { name, phone, type, duration, isMuted, isSpeaker } or null

      // Active call duration timer
      useEffect(() => {
        let interval;

          interval = setInterval(() => {
            setActiveCall((prev) => (prev ? { ...prev, duration: prev.duration + 1 } : null));

      const [routeProgress, setRouteProgress] = useState(15);


      // Animate Route Line when dispatched
      useEffect(() => {
        let interval;

            setRouteProgress((prev) => {

          }, 150);
        }
        return () => clearInterval(interval);

          if (sosState === 'dispatched') {
            setFirstAidTime((prev) => prev + 1);

          setCctvAlertElapsed((prev) => {
            const next = { ...prev };

            next["CAM-003"] += 1;
            next["CAM-005"] += 1;
            if (cctvCam4Alert) {
              next["CAM-004"] += 1;

            return next;

        }, 1000);
        return () => clearInterval(interval);

            triggerToast("New Incident Detected — Kurla Station Exit", "warning");

        const id = Date.now();
        setToasts((prev) => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts((prev) => prev.filter((t) => t.id !== id));
        }, 4000);

        if (icuPrepared) return;

      };

      // 3-second SOS Countdown Timer Effect
      useEffect(() => {
        if (sosCountdown === null) return;
        if (sosCountdown > 0) {
          countdownTimerRef.current = setTimeout(() => {
            setSosCountdown(prev => (prev !== null && prev > 0 ? prev - 1 : null));
          }, 1000);
        } else if (sosCountdown === 0) {
          setSosCountdown(null);
          executeSosCreation(pendingSosType);
        }
        return () => {
          if (countdownTimerRef.current) clearTimeout(countdownTimerRef.current);
        };
      }, [sosCountdown, pendingSosType]);

      // Cancel SOS Countdown
      const handleCancelSosCountdown = () => {
        if (countdownTimerRef.current) {
          clearTimeout(countdownTimerRef.current);
          countdownTimerRef.current = null;
        }
        setSosCountdown(null);
        triggerToast("Emergency request cancelled.", "info");
      };

      // Periodic Status Poller from Servlet Backend
      const pollEmergencyStatus = async () => {
        try {
          const res = await fetch('emergency/status', { headers: { 'Accept': 'application/json' } });
          if (!res.ok) return;
          const data = await res.json();
          if (data.success && data.hasActive && data.request) {
            const req = data.request;
            setActiveEmergencyRequest(req);

            if (req.status === 'PENDING' || req.status === 'RECEIVED' || req.status === 'UNDER_REVIEW') {
              setSosState('connecting');
            } else if (req.status === 'APPROVED') {
              setSosState('connecting');
            } else if (req.status === 'AMBULANCE_ASSIGNED' || req.status === 'DISPATCHED' || req.status === 'ARRIVING') {
              if (sosState !== 'dispatched') {
                setSosState('dispatched');
                setDispatchedType(req.emergencyType || 'Ambulance');
                const etaVal = req.emergencyType === 'Police Support' ? 3 : req.emergencyType === 'Fire Rescue' ? 4 : 5;
                setPatientVitals(prev => ({ 
                  ...prev, 
                  eta: etaVal,
                  hospital: req.hospitalName || prev.hospital
                }));
                triggerToast(`Ambulance ${req.vehicleNumber || ''} assigned by ${req.hospitalName || 'Hospital'}! Driver: ${req.driverName || 'Medic'}`, "success");
              }
            } else if (req.status === 'COMPLETED') {
              triggerToast("Emergency response completed successfully.", "success");
              handleResetSos();
            } else if (req.status === 'REJECTED') {
              triggerToast(`Emergency request rejected by hospital: ${req.rejectionReason || 'Unable to accommodate. Please call 112 directly.'}`, "error");
              setSosState('idle');
              setActiveEmergencyRequest(null);
            } else if (req.status === 'CANCELLED') {
              triggerToast("Emergency request was cancelled.", "info");
              setSosState('idle');
              setActiveEmergencyRequest(null);
            }
          } else if (data.success && !data.hasActive && sosState === 'connecting') {
            setSosState('idle');
            setActiveEmergencyRequest(null);
          }
        } catch (err) {
          // Graceful handling
        }
      };

      // Poll on load and when active
      useEffect(() => {
        if (isAuthenticated) {
          pollEmergencyStatus();
        }
      }, [isAuthenticated]);

      useEffect(() => {
        if (sosState === 'idle') return;
        const intervalId = setInterval(pollEmergencyStatus, 3000);
        return () => clearInterval(intervalId);
      }, [sosState]);

      // Trigger SOS Sequence - Initiates 3-Second Confirmation Window
      const handleTriggerSos = (type = "Ambulance") => {
        if (sosState !== 'idle' || sosCountdown !== null || sosSubmitting) {
          if (activeEmergencyRequest) {
            triggerToast("Active emergency request in progress. Tracking status.", "info");
          }
          return;
        }
        setPendingSosType(type);
        setSosCountdown(3);
      };

      // Sends SOS Creation Request to Backend after 3 seconds elapse
      const executeSosCreation = async (type = "Ambulance") => {
        if (sosSubmitting) return;
        setSosSubmitting(true);
        setSosState('connecting');
        setDispatchedType(type);
        triggerToast("Transmitting emergency request to regional trauma centers...", "info");

        try {
          const body = new URLSearchParams();
          body.append('emergencyType', type);
          let loc = 'Live GPS: 19.0596° N, 72.8295° E (Bandra West, Mumbai)';
          if (citizenUser && citizenUser.address && typeof citizenUser.address === 'string' && citizenUser.address.trim()) {
            loc = citizenUser.address.trim();
          }
          body.append('userLocation', loc);

          const res = await fetch('emergency/create', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded',
              'Accept': 'application/json'
            },
            body: body.toString()
          });

          const data = await res.json().catch(() => ({}));
          if (res.ok && data.success) {
            setActiveEmergencyRequest(data.request);
            triggerToast("Emergency request created. Awaiting hospital authorization.", "success");
            pollEmergencyStatus();
          } else {
            triggerToast(data.message || "Failed to create emergency request.", "error");
            setSosState('idle');
          }
        } catch (err) {
          console.error("SOS creation error:", err);
          triggerToast("Emergency request queued.", "info");
        } finally {
          setSosSubmitting(false);
        }
      };

      // Citizen Cancel Active Emergency
      const handleCancelActiveEmergency = async () => {
        if (!confirm("Are you sure you want to cancel this emergency request?")) return;
        try {
          const res = await fetch('emergency/cancel', {
            method: 'POST',
            headers: { 'Accept': 'application/json' }
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok && data.success) {
            triggerToast("Emergency request cancelled.", "info");
            handleResetSos();
          } else {
            triggerToast(data.message || "Failed to cancel request.", "error");
          }
        } catch (err) {
          triggerToast("Failed to communicate cancellation with server.", "error");
        }
      };

      // Reset SOS simulation
      const handleResetSos = () => {
        setSosState('idle');
        setSosCountdown(null);
        setActiveEmergencyRequest(null);
        setSosSubmitting(false);
        setIcuPrepared(false);
        setIcuBedsAvailable(3);
        setRouteProgress(15);
        setFirstAidTime(0);
        setFirstAidActiveTab('cardiac');
        setBurnSeverity('mild');
        setVoiceGuidance(false);
        setMatchingType('cardiac');
        setShowMatchingModal(false);
        setCctvCam4Alert(false);
        setShowCctvModal(null);
        setDispatchedType('Ambulance');
        setHazardReportType('Building Fire');
        setWomenSafetyMode(false);
        setLoudEmergencyMode(false);
        
        // Stop speech
        stopSpeech();
        
        // Stop recording stream
        if (mediaStream) {
          mediaStream.getTracks().forEach(track => track.stop());
          setMediaStream(null);
        }
        setIsRecording(false);
        setRecordingProgress(0);
        setRecordedChunks([]);

        setCctvAlertElapsed({
          "CAM-001": 42,
          "CAM-003": 18,
          "CAM-005": 115,
          "CAM-004": 0
        });
        setPatientVitals(prev => ({
          ...prev,
          spO2: 89,
          hr: 112,
          bp: "140/90",
          severity: "CRITICAL",
          severityScore: 87,
          hospital: "Lilavati Hospital",
          route: "SV Road → Link Road → Hindmata",
          distance: 3.2,
          eta: 6
        }));
        triggerToast("Citizen emergency simulated sequence reset.", "info");
      };

      // Live GPS Acquisition Handler
      const fetchLiveGps = (showToastNotification = true) => {
        if (!navigator.geolocation) {
          setGpsLocation(prev => ({ ...prev, status: 'error', errorMsg: 'Geolocation is not supported by your browser.' }));
          if (showToastNotification) triggerToast('Geolocation is not supported by your browser.', 'warning');
          return;
        }
        setGpsLocation(prev => ({ ...prev, status: 'locating', errorMsg: null }));
        if (showToastNotification) triggerToast('Querying device GPS sensors...', 'info');

        navigator.geolocation.getCurrentPosition(
          async (position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const acc = Math.round(position.coords.accuracy * 10) / 10;
            const latStr = `${Math.abs(lat).toFixed(4)}° ${lat >= 0 ? 'N' : 'S'}`;
            const lonStr = `${Math.abs(lon).toFixed(4)}° ${lon >= 0 ? 'E' : 'W'}`;

            let displayAddr = `${latStr}, ${lonStr}`;
            let displayCoords = `${latStr}, ${lonStr} • Signal Precision ±${acc}m`;

            try {
              const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&zoom=16`);
              if (res.ok) {
                const data = await res.json();
                if (data && data.display_name) {
                  const parts = data.display_name.split(',');
                  displayAddr = parts.slice(0, 3).join(', ').trim();
                  displayCoords = `${latStr}, ${lonStr} • ${parts.slice(3, 5).join(', ').trim()}`;
                }
              }
            } catch (err) {
              console.warn("Reverse geocode fallback to coords:", err);
            }

            setGpsLocation({
              status: 'acquired',
              address: displayAddr,
              coordsText: displayCoords,
              latitude: lat,
              longitude: lon,
              accuracy: acc,
              source: acc <= 30 ? 'High-Precision Satellite GPS Lock' : 'Cellular / Wi-Fi Triangulation',
              timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
              errorMsg: null
            });
            if (showToastNotification) triggerToast(`Live GPS Acquired: ${displayAddr} (±${acc}m)`, 'success');
          },
          (error) => {
            console.warn("Geolocation acquisition error:", error);
            let msg = "Location access denied or unavailable.";
            if (error.code === 1) msg = "Location permission denied. Please allow location access in your browser.";
            else if (error.code === 2) msg = "Device position unavailable. Using nearest cellular node.";
            else if (error.code === 3) msg = "GPS satellite request timed out.";

            setGpsLocation(prev => ({
              ...prev,
              status: 'error',
              errorMsg: msg
            }));
            if (showToastNotification) triggerToast(msg, 'warning');
          },
          { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
        );
      };

      // Auto-fetch live GPS on load
      useEffect(() => {
        if (navigator.geolocation) {
          fetchLiveGps(false);
        }
      }, []);

      // Real Incident Media File Selection Handler
      const handleFileSelected = (file) => {
        if (!file) return;
        const previewUrl = file.type && file.type.startsWith('image/') ? URL.createObjectURL(file) : null;
        const formattedSize = file.size > 1024 * 1024
          ? (file.size / (1024 * 1024)).toFixed(1) + ' MB'
          : Math.round(file.size / 1024) + ' KB';

        setUploadedFile({
          name: file.name,
          size: formattedSize,
          type: file.type || 'application/octet-stream',
          previewUrl: previewUrl
        });

        setMediaUploadStatus('uploading');
        setUploadProgress(15);
        let current = 15;
        const interval = setInterval(() => {
          current += Math.floor(Math.random() * 25) + 15;
          if (current >= 100) {
            clearInterval(interval);
            setUploadProgress(100);
            setMediaUploadStatus('completed');
            triggerToast(`File "${file.name}" attached & encrypted for Emergency ER Response.`, 'success');
          } else {
            setUploadProgress(current);
          }
        }, 180);
      };

      const handleClearMedia = () => {
        if (uploadedFile && uploadedFile.previewUrl) {
          URL.revokeObjectURL(uploadedFile.previewUrl);
        }
        setUploadedFile(null);
        setMediaUploadStatus('idle');
        setUploadProgress(0);
        triggerToast("Incident media attachment cleared.", "info");
      };

      // Emergency Call Handlers: Permission Check & Real Dial Trigger
      const handleInitiateCall = (target) => {
        let contactObj;
        if (typeof target === 'string') {
          if (target.includes('Police')) {
            contactObj = { name: target, phone: '100 / 112', type: 'POLICE CONTROL DESK' };
          } else if (target.includes('Fire')) {
            contactObj = { name: target, phone: '101', type: 'FIRE RESCUE DESK' };
          } else if (target.includes('Asha')) {
            contactObj = { name: 'Asha Patil (Mother)', phone: '+91 98201 54321', type: 'PRIMARY KIN' };
          } else if (target.includes('Verma')) {
            contactObj = { name: 'Dr. Amit Verma (Family Doctor)', phone: '+91 98199 87654', type: 'MEDICAL ADVISER' };
          } else {
            contactObj = { name: target, phone: '112', type: 'EMERGENCY LINE' };
          }
        } else {
          contactObj = target;
        }
        setCallPrompt(contactObj);
      };

      const handleConfirmCall = () => {
        if (!callPrompt) return;
        const target = callPrompt;
        setCallPrompt(null);

        const cleanNumber = target.phone.replace(/[^0-9+]/g, '');
        try {
          if (cleanNumber) {
            window.location.href = `tel:${cleanNumber}`;
          }
        } catch (e) {
          console.warn("Dialer protocol launch:", e);
        }

        setActiveCall({
          name: target.name,
          phone: target.phone,
          type: target.type || 'EMERGENCY LINE',
          duration: 0,
          isMuted: false,
          isSpeaker: false
        });
        triggerToast(`Call authorized. Connecting line to ${target.name}...`, "success");
      };

      const handleEndCall = () => {
        if (activeCall) {
          const durSec = activeCall.duration;
          const mins = Math.floor(durSec / 60);
          const secs = durSec % 60;
          const durStr = `${mins > 0 ? mins + 'm ' : ''}${secs}s`;
          triggerToast(`Emergency call ended with ${activeCall.name} (Duration: ${durStr})`, "info");
        }
        setActiveCall(null);
      };

      // Emergency camera / audio recording
      const startEmergencyRecording = async () => {
        setRecordedChunks([]);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          setMediaStream(stream);
          setTimeout(() => {
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
            }
          }, 300);
          setIsRecording(true);
          const mediaRecorder = new MediaRecorder(stream);
          mediaRecorderRef.current = mediaRecorder;
          
          let chunks = [];
          mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) {
              chunks.push(e.data);
            }
          };

          mediaRecorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            setRecordedChunks((prev) => [...prev, url]);
            triggerToast("Emergency recording saved locally. Forwarded to Police Command.", "success");
          };

          mediaRecorder.start();
          triggerToast("Broadcasting live video/audio feed to Police dispatch...", "info");
        } catch (err) {
          console.warn("Camera/Mic access denied or unavailable. Running simulated recording stream.", err);
          setIsRecording(true);
          triggerToast("Running simulated emergency recording feed (Webcam blocked).", "warning");
        }
      };

      const stopEmergencyRecording = () => {
        if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
          mediaRecorderRef.current.stop();
        }
        if (mediaStream) {
          mediaStream.getTracks().forEach(track => track.stop());
          setMediaStream(null);
        }
        setIsRecording(false);
      };

      // Update Patient Status parameters
      const saveVitalsUpdate = (newVitals) => {
        setPatientVitals((prev) => {
          const updated = { ...prev, ...newVitals };
          // Dynamically adjust severity based on SpO2
          if (updated.spO2 >= 96) {
            updated.severity = "STABLE";
            updated.severityScore = 35;
          } else if (updated.spO2 >= 90) {
            updated.severity = "HIGH";
            updated.severityScore = 65;
          } else {
            updated.severity = "CRITICAL";
            updated.severityScore = 87;
          }
          return updated;
        });
        setShowVitalsModal(false);
        triggerToast("Patient telemetry updated successfully across network.", "success");
      };

      // Rerouting selection
      const handleOverrideHospital = (hospitalName) => {
        const routeData = {
          "KEM Hospital": { route: "SV Road → WEH Flyover → Dadar TT", distance: 6.8, eta: 14 },
          "Hinduja Hospital": { route: "SV Road → Mahim Cause → Cadell Road", distance: 5.5, eta: 11 },
          "Lilavati Hospital": { route: "SV Road → Link Road → Hindmata", distance: 3.2, eta: 6 }
        };
        const details = routeData[hospitalName] || { route: "SV Road → Route", distance: 4.0, eta: 8 };

        setPatientVitals((prev) => ({
          ...prev,
          hospital: hospitalName,
          route: details.route,
          distance: details.distance,
          eta: details.eta
        }));
        triggerToast(`Rerouted telemetry to ${hospitalName}. GPS waypoint sent.`, "warning");
      };

      if (authLoading) {
        return (
          <div className="h-screen w-screen bg-navy-950 flex flex-col items-center justify-center text-white p-6 font-sans">
            <div className="w-16 h-16 bg-accent/20 rounded-2xl flex items-center justify-center text-accent animate-pulse mb-4 ring-2 ring-accent/30">
              <IconHeartRoute />
            </div>
            <h2 className="text-xl font-extrabold tracking-wider bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">PULSEROUTE</h2>
            <p className="text-xs text-slate-400 mt-1">Verifying encrypted citizen telemetry session...</p>
            <div className="w-32 bg-slate-800 rounded-full h-1.5 mt-4 overflow-hidden">
              <div className="bg-accent h-full rounded-full animate-pulse w-2/3"></div>
            </div>
          </div>
        );
      }

      if (!isAuthenticated) {
        return (
          <React.Fragment>
            {/* TOAST SYSTEM FOR AUTH PORTAL */}
            <div className="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full px-4 md:px-0">
              {toasts.map((t) => (
                <div key={t.id} className={`pointer-events-auto p-4 rounded-xl shadow-lg border text-white flex items-start gap-3 transition-all duration-300 transform translate-y-0 fade-in ${
                  t.type === 'success' ? 'bg-success border-emerald-600' :
                  t.type === 'warning' ? 'bg-warning border-amber-600' :
                  'bg-navy-900 border-navy-800'
                }`}>
                  <div className="mt-0.5">
                    {t.type === 'success' ? (
                      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                      </svg>
                    ) : t.type === 'warning' ? (
                      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                      </svg>
                    ) : (
                      <svg className="w-5 h-5 text-accent animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                      </svg>
                    )}
                  </div>
                  <div className="flex-1 text-sm font-medium">{t.message}</div>
                </div>
              ))}
            </div>

            <CitizenAuthPortal
              authView={authView}
              setAuthView={setAuthView}
              authAlert={authAlert}
              setAuthAlert={setAuthAlert}
              language={language}
              setLanguage={setLanguage}
              onAuthSuccess={(user) => {
                setCitizenUser(user);
                setIsAuthenticated(true);
                setAuthAlert(null);
                triggerToast(`Authenticated successfully. Welcome, ${user.fullName || 'Citizen'}!`, "success");
              }}
              triggerToast={triggerToast}
            />
          </React.Fragment>
        );
      }

      return (
        <div className="flex h-screen w-screen overflow-hidden bg-slate-50 flex-col md:flex-row">

          {/* TOAST SYSTEM CONTAINER */}
          <div className="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full px-4 md:px-0">
            {toasts.map((t) => (
              <div key={t.id} className={`pointer-events-auto p-4 rounded-xl shadow-lg border text-white flex items-start gap-3 transition-all duration-300 transform translate-y-0 fade-in ${t.type === 'success' ? 'bg-success border-emerald-600' :
                  t.type === 'warning' ? 'bg-warning border-amber-600' :
                    'bg-navy-900 border-navy-800'
                }`}>
                <div className="mt-0.5">
                  {t.type === 'success' ? (
                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                  ) : t.type === 'warning' ? (
                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                  ) : (
                    <svg className="w-5 h-5 text-accent animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                  )}
                </div>
                <div className="flex-1 text-sm font-medium">{t.message}</div>
              </div>
            ))}
          </div>

          {/* CALL PERMISSION / AUTHORIZATION MODAL */}
          {callPrompt && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
              <div className="bg-white rounded-3xl border border-slate-100 max-w-md w-full p-6 shadow-2xl text-left relative overflow-hidden animate-in fade-in">
                <div className="w-12 h-12 bg-amber-50 rounded-2xl flex items-center justify-center text-amber-600 mb-4 border border-amber-100">
                  <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                  </svg>
                </div>

                <div className="flex items-center justify-between">
                  <h3 className="text-xl font-bold text-slate-900">Outgoing Call Permission</h3>
                  <span className="text-[10px] font-bold tracking-wider uppercase px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600">
                    Telephony Auth
                  </span>
                </div>
                <p className="text-slate-500 text-xs mt-1.5 leading-relaxed">
                  PulseRoute requires citizen authorization to trigger your device's cellular telephony gateway and open an emergency voice line.
                </p>

                <div className="bg-slate-50 border border-slate-100 rounded-2xl p-4 my-5 flex items-center gap-4">
                  <div className="w-12 h-12 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center shrink-0">
                    <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.94.725l.548 2.2a1 1 0 01-.321.988l-1.305.98a10.582 10.582 0 004.872 4.872l.98-1.305a1 1 0 01.988-.321l2.2.548a1 1 0 01.725.94V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                    </svg>
                  </div>
                  <div className="flex-1 min-w-0">
                    <span className="text-[10px] font-bold text-accent tracking-wider uppercase block">
                      {callPrompt.type || 'EMERGENCY RECIPIENT'}
                    </span>
                    <h4 className="text-base font-bold text-slate-900 truncate">{callPrompt.name}</h4>
                    <p className="text-sm font-mono text-slate-600 mt-0.5 font-semibold">{callPrompt.phone}</p>
                  </div>
                </div>

                <div className="text-[11px] text-slate-500 bg-amber-50/60 border border-amber-100 rounded-xl p-3 mb-5 flex items-start gap-2">
                  <span className="text-amber-600 font-bold shrink-0">ℹ</span>
                  <span>Allowing this call will launch your system dialer (Mobile / Phone Link / Cellular) and initiate real-time call telemetry.</span>
                </div>

                <div className="flex items-center gap-3">
                  <button
                    type="button"
                    onClick={() => { setCallPrompt(null); triggerToast("Outgoing call cancelled", "info"); }}
                    className="flex-1 py-3 px-4 rounded-xl border border-slate-200 text-slate-700 font-bold text-sm hover:bg-slate-50 transition"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={handleConfirmCall}
                    className="flex-1 py-3 px-4 rounded-xl bg-success hover:bg-emerald-600 text-white font-bold text-sm transition shadow-md flex items-center justify-center gap-2"

    // Mathematical Bezier curve interpolator to avoid DOM and SVG rendering dependencies
    function AmbulancePathFollower({ routeProgress }) {
      const coords = useMemo(() => {
        const u = routeProgress / 100;
        let t, p0, p1, p2, p3;
        
        if (u <= 0.5) {
          // Segment 1
          t = u * 2;
          p0 = { x: 60, y: 150 };
          p1 = { x: 120, y: 150 };
          p2 = { x: 120, y: 50 };
          p3 = { x: 250, y: 50 };
        } else {
          // Segment 2
          t = (u - 0.5) * 2;
          p0 = { x: 250, y: 50 };
          p1 = { x: 380, y: 50 };
          p2 = { x: 380, y: 150 };
          p3 = { x: 440, y: 150 };
        }
        
        const mt = 1 - t;
        const mt2 = mt * mt;
        const mt3 = mt2 * mt;
        const t2 = t * t;
        const t3 = t2 * t;
        
        const x = mt3 * p0.x + 3 * mt2 * t * p1.x + 3 * mt * t2 * p2.x + t3 * p3.x;
        const y = mt3 * p0.y + 3 * mt2 * t * p1.y + 3 * mt * t2 * p2.y + t3 * p3.y;
        
        return { x, y };
      }, [routeProgress]);

      return (
        <g transform={`translate(${coords.x - 12}, ${coords.y - 12})`}>
          <circle cx="12" cy="12" r="14" fill="#E85D24" className="opacity-20 animate-ping" />
          <text x="12" y="18" fontSize="20" textAnchor="middle">🚑</text>
        </g>
      );

        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      };

      // Simulated Countdown Timer: starts at 6m (360s)
      const countdownSecs = Math.max(0, 360 - firstAidTime);

      // Play Oscillator Beep (Metronome)
      const playBeep = () => {
        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();
          oscillator.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(850, audioCtx.currentTime); // 850Hz tone
          gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
          oscillator.start();
          oscillator.stop(audioCtx.currentTime + 0.05); // 50ms pulse
        } catch (e) {
          // ignore context blocked errors
        }
      };

      // Metronome clock
      useEffect(() => {
        let interval;
        if (activeFirstAidTab === 'cardiac' && metronomeSound) {
          interval = setInterval(() => {
            playBeep();
          }, 600); // 100 compressions per minute = 1 beat per 600ms
        }
        return () => clearInterval(interval);
      }, [activeFirstAidTab, metronomeSound]);

        <div className="max-w-4xl mx-auto space-y-6 fade-in pb-20">

                <span className="text-2xl font-black text-accent tracking-tight leading-none mt-0.5 block">{formatTime(countdownSecs)}</span>
              </div>

                <span className="text-[9px] font-bold text-slate-400 uppercase block">{t('firstaid.timeSinceTrigger')}</span>
                <span className="text-2xl font-black text-slate-800 tracking-tight leading-none mt-0.5 block">{formatTime(firstAidTime)}</span>

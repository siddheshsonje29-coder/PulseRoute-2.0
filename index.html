          <div className="bg-slate-900 text-white rounded-2xl p-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <span className="text-[9px] font-black uppercase tracking-widest text-slate-400 block">Active AI Matching Scenario</span>
              <h4 className="font-extrabold text-sm mt-0.5"> राहुल एम. — Cardiac Arrest | Severity: 9.2 (Critical)</h4>
            </div>
            <div className="bg-slate-800 border border-slate-700/80 rounded-xl px-3 py-1 text-xs">
              AI Recommendation: <strong className="text-accent font-bold">MH-04-EM-2291 (Cardiac Unit)</strong>
            </div>
          </div>

          {/* Filter Quick-switches */}
          <div className="flex gap-2">
            {[
              { id: 'cardiac', label: 'Cardiac Arrest scenario' },
              { id: 'trauma', label: 'Trauma / Accident' },
              { id: 'neonatal', label: 'Premature Birth' }
            ].map((btn) => (
              <button
                key={btn.id}
                onClick={() => setMatchingType(btn.id)}
                className={`py-2 px-4 rounded-xl font-bold text-xs uppercase tracking-wider transition border cursor-pointer ${
                  matchingType === btn.id
                    ? 'bg-accent text-white border-accent shadow-sm shadow-accent/20'
                    : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
                }`}
              >
                {btn.label}
              </button>
            ))}
          </div>

          {/* Ambulance Cards Grid */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {sortedAmbulances.map((amb) => {
              const isBest = amb.scores[matchingType] >= 90;
              const isMaintenance = amb.status === 'Maintenance';
              
              return (
                <div 
                  key={amb.id}
                  className={`bg-white border rounded-2xl p-5 flex flex-col justify-between gap-4 transition-all duration-300 ${
                    amb.dispatchedMatch && sosState === 'dispatched'
                      ? 'border-2 border-accent bg-orange-50/5 shadow-md shadow-accent/5'
                      : isBest && !isMaintenance
                        ? 'border-2 border-emerald-500/80 bg-emerald-50/5'
                        : 'border-slate-100'
                  }`}
                >
                  <div className="flex justify-between items-start">
                    <div>
                      <div className="flex items-center gap-2">
                        <h4 className="font-extrabold text-slate-900 text-sm">{amb.id}</h4>
                        {isBest && !isMaintenance && (
                          <span className="bg-emerald-500 text-white text-[8px] font-black uppercase tracking-widest px-2 py-0.5 rounded">BEST MATCH</span>
                        )}
                        {amb.dispatchedMatch && sosState === 'dispatched' && (
                          <span className="bg-accent text-white text-[8px] font-black uppercase tracking-widest px-2 py-0.5 rounded animate-pulse">Dispatched</span>
                        )}
                      </div>
                      <span className="text-xs text-slate-400 font-semibold mt-0.5 block">Driver: {amb.driver}</span>
                    </div>

                    <span className={`text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full border ${
                      amb.status === 'Available' ? 'bg-emerald-50 text-success border-emerald-100' :
                      amb.status === 'DISPATCHED' ? 'bg-red-50 text-danger border-red-100' :
                      'bg-slate-100 text-slate-400 border-slate-200'
                    }`}>
                      {amb.status}
                    </span>
                  </div>

                  {/* Gear Badges */}
                  <div className="flex flex-wrap gap-1.5">
                    {amb.gear.map((tag) => (
                      <span key={tag} className={`text-[9px] font-bold px-2 py-0.5 rounded-md border ${gearColors[tag] || 'bg-slate-100 text-slate-500'}`}>
                        {tag}
                      </span>
                    ))}
                  </div>

                  {/* Score & button row */}
                  <div className="flex items-center justify-between border-t border-slate-50 pt-4 mt-1">
                    <div className="flex items-baseline gap-1">
                      <span className={`text-2xl font-black ${
                        amb.scores[matchingType] >= 85 ? 'text-success' :
                        amb.scores[matchingType] >= 60 ? 'text-warning' :
                        'text-danger'
                      }`}>
                        {isMaintenance ? '0' : amb.scores[matchingType]}%
                      </span>
                      <span className="text-[9px] font-bold text-slate-400 uppercase tracking-widest">AI Match</span>
                    </div>

                    <button
                      disabled={amb.status !== 'Available'}
                      className={`py-1.5 px-4 rounded-lg font-bold text-xs uppercase tracking-wider border transition-all ${
                        amb.status === 'Available'
                          ? 'bg-navy-900 text-white border-navy-900 hover:bg-slate-800 cursor-pointer shadow-sm'
                          : 'bg-slate-100 text-slate-400 border-slate-200 cursor-not-allowed'
                      }`}
                    >
                      {amb.status === 'DISPATCHED' ? "Dispatched" : amb.status === 'Maintenance' ? "Unavailable" : "Dispatch Unit"}
                    </button>
                  </div>
                </div>
              );
            })}
          </div>

          {/* AI MATCHING DECISION LOGS */}
          <div className="bg-white border border-slate-100 rounded-3xl p-5 md:p-6 shadow-sm space-y-4">
            <h4 className="font-extrabold text-slate-800 text-sm">Decision Logic: Unit Matching Reasoning</h4>
            
            <div className="space-y-2 text-xs text-slate-600 font-semibold">
              {checkLists[matchingType].map((item, idx) => (
                <div key={idx} className={`flex items-start gap-2.5 reveal-item ${item.css}`}>
                  <span className={`text-sm shrink-0 ${item.check ? 'text-success' : 'text-slate-400 strikethrough'}`}>
                    {item.check ? '✓' : '✗'}
                  </span>
                  <span className={item.check ? 'text-slate-700' : 'text-slate-400 line-through'}>
                    {item.text}
                  </span>
                </div>
              ))}
            </div>

            {/* requirement legend bottom */}
            <div className="bg-slate-50 border border-slate-100 rounded-2xl p-4 grid grid-cols-1 sm:grid-cols-3 gap-3 text-[10px] text-slate-500 pt-3 border-t border-slate-100">
              <div>
                <strong className="text-slate-700 block uppercase mb-0.5">Cardiac arrest needs:</strong>
                <span>Cardiac Monitor, Defibrillator, Ventilator</span>
              </div>
              <div>
                <strong className="text-slate-700 block uppercase mb-0.5">Trauma / Injury needs:</strong>
                <span>Trauma Kit, Oxygen Supply, BLS</span>
              </div>
              <div>
                <strong className="text-slate-700 block uppercase mb-0.5">Neonatal Triage needs:</strong>
                <span>Neonatal Support, Incubator, Oxygen</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- FEATURE 4: CCTV DETECTION SCREEN ---
    function CctvDetectionScreen({
      cctvCam4Alert,
      cctvAlertElapsed,
      showCctvModal,
      setShowCctvModal,
      triggerToast
    }) {
      const [aiDetectionOn, setAiDetectionOn] = useState(true);
      const [showConfirmDispatchAlert, setShowConfirmDispatchAlert] = useState(false);

      // Format ticking clocks
      const formatTimeElapsed = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins}m ${secs}s ago`;
      };

      const cameras = [
        { id: "CAM-001", location: "Andheri Junction Grid", alert: true, detected: "Vehicle Collision", confidence: 94, desc: "Collision involving two passenger vehicles. Traffic segment blockage detected.", color: "bg-red-500" },
        { id: "CAM-002", location: "Bandra Flyover Sector 2", alert: false, detected: "Normal Traffic Flow", confidence: null, desc: "Average vehicle speeds computed: 52 km/h. Clear segment.", color: "bg-emerald-500" },
        { id: "CAM-003", location: "Dharavi Crossroad Node", alert: true, detected: "Person Down / Fall", confidence: 87, desc: "Individual collapsed on pedestrian walkway. Vital distress possible.", color: "bg-red-500" },
        { id: "CAM-004", location: "Kurla Station Exit Hub", alert: cctvCam4Alert, detected: cctvCam4Alert ? "Person Down / Fall" : "Normal Pedestrian Flow", confidence: cctvCam4Alert ? 90 : null, desc: cctvCam4Alert ? "Anomalous fall event logged at exit stairs." : "Regular foot traffic index. No anomalies.", color: cctvCam4Alert ? "bg-red-500" : "bg-emerald-500" },
        { id: "CAM-005", location: "Chembur Highway Segment", alert: true, detected: "Smoke / Fire plume", confidence: 91, desc: "Aerosol readings indicating possible engine fire on corridor shoulder.", color: "bg-warning" },
        { id: "CAM-006", location: "Sion Hospital Road Junction", alert: false, detected: "Normal Traffic Flow", confidence: null, desc: "Speeds locked at 40 km/h. High ambulance passage compliance index.", color: "bg-emerald-500" }
      ];

      const activeAlertsList = cameras.filter(cam => cam.alert && aiDetectionOn);

      const handleConfirmAutoDispatch = () => {
        setShowConfirmDispatchAlert(true);
        setTimeout(() => {
          setShowConfirmDispatchAlert(false);
          setShowCctvModal(null);
          triggerToast("Auto-Dispatch confirmation successfully broadcast to regional station.", "success");
        }, 1500);
      };

      return (
        <div className="max-w-6xl mx-auto space-y-6 fade-in pb-20 text-left">
          
          {/* Top Panel Controls bar */}
          <div className="flex flex-col md:flex-row md:items-center justify-between border-b border-slate-200 pb-4 gap-4">
            <div>
              <h1 className="text-3xl font-black text-slate-900 tracking-tight flex items-center gap-2">
                <span>📹</span> AI Surveillance — Live Incident Detection
              </h1>
              <p className="text-slate-500 text-xs mt-1">Smart City Camera Feed analysis. Incident locks auto-generate dispatch waypoint files.</p>
            </div>

            <div className="flex items-center gap-4 w-full md:w-auto justify-between md:justify-end">
              <div className="inline-flex items-center gap-2 bg-emerald-50 text-success border border-emerald-100 rounded-full px-3.5 py-1.5 text-xs font-bold shadow-sm">
                <span className="h-2 w-2 rounded-full bg-success active-pulse"></span>
                12 Camera Feeds Active
              </div>

              {/* Toggle switch AI ON/OFF */}
              <div className="flex items-center gap-2 bg-white border border-slate-200 rounded-xl px-4 py-2 text-xs font-bold shadow-sm">
                <span className="text-slate-500">AI Detection Engine</span>
                <button
                  onClick={() => setAiDetectionOn(!aiDetectionOn)}
                  className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors cursor-pointer focus:outline-none ${
                    aiDetectionOn ? 'bg-success' : 'bg-slate-300'
                  }`}
                >
                  <span className={`inline-block h-4 w-4 transform rounded-full bg-white transition-transform ${
                    aiDetectionOn ? 'translate-x-6' : 'translate-x-1'
                  }`} />
                </button>
              </div>
            </div>
          </div>

          {/* MAIN COLUMN CAMERA GRID & ALERTS timeline LIST */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            {/* 2x3 Camera feeds */}
            <div className="lg:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-4">
              {cameras.map((cam) => (
                <div 
                  key={cam.id}
                  className={`bg-navy-950 rounded-2xl border relative overflow-hidden flex flex-col justify-between min-h-[220px] transition-all duration-300 hover:-translate-y-0.5 hover:shadow-lg ${
                    cam.alert && aiDetectionOn
                      ? 'border-danger ring-2 ring-danger/40 ring-offset-2 ring-offset-slate-50' 
                      : 'border-slate-800'
                  }`}
                >
                  {/* Camera overlay header info */}
                  <div className="p-3 bg-navy-900/80 backdrop-blur-sm border-b border-slate-900/60 flex items-center justify-between text-white text-[10px] font-mono font-semibold relative z-10">
                    <span>{cam.id} — {cam.location.split(" ")[0]}</span>
                    {cam.alert && aiDetectionOn ? (
                      <span className="text-danger flex items-center gap-1 font-bold active-pulse">
                        <span className="h-1.5 w-1.5 rounded-full bg-danger animate-ping"></span>
                        INCIDENT DETECTED
                      </span>
                    ) : (
                      <span className="text-success font-bold flex items-center gap-1">
                        <span className="h-1.5 w-1.5 rounded-full bg-success"></span>
                        LIVE
                      </span>
                    )}
                  </div>

                  {/* Simulated traffic animation background graphics */}
                  <div className="flex-1 bg-navy-950 flex items-center justify-center p-4 select-none relative overflow-hidden">
                    {/* Background Grid */}
                    <div className="absolute inset-0 bg-[linear-gradient(rgba(30,41,59,0.4)_1px,transparent_1px),linear-gradient(90deg,rgba(30,41,59,0.4)_1px,transparent_1px)] bg-[size:16px_16px]"></div>
                    
                    {/* Road graphics */}
                    <div className="w-full h-8 bg-slate-900 border-y border-slate-800 absolute flex items-center">
                      <div className="w-full border-t border-dashed border-slate-700/60"></div>
                    </div>

                    {/* Animated moving cars elements */}
                    {!cam.alert && cam.id !== 'CAM-004' && (
                      <React.Fragment>
                        <div className="w-6 h-3 bg-blue-500 rounded absolute cctv-car-flow-1"></div>
                        <div className="w-8 h-3.5 bg-slate-400 rounded absolute cctv-car-flow-2"></div>
                        <div className="w-5 h-3 bg-teal-400 rounded absolute cctv-car-flow-3"></div>
                      </React.Fragment>
                    )}

                    {cam.id === 'CAM-004' && !cctvCam4Alert && (
                      <React.Fragment>
                        <div className="w-6 h-3 bg-amber-500 rounded absolute cctv-car-flow-1"></div>
                        <div className="w-8 h-3.5 bg-slate-500 rounded absolute cctv-car-flow-2"></div>
                      </React.Fragment>
                    )}

                    {/* Incident overlays inside camera */}
                    {cam.alert && aiDetectionOn && (
                      <div className="absolute inset-0 bg-red-950/20 backdrop-blur-[0.5px] flex flex-col items-center justify-center text-center p-3 z-10">
                        <div className="w-10 h-10 rounded-full bg-danger/25 border border-danger/35 flex items-center justify-center text-danger text-lg font-bold mb-2 animate-bounce">
                          {cam.detected.includes("Collision") ? "💥" : cam.detected.includes("Smoke") ? "🔥" : "👤"}
                        </div>
                        <span className="text-white text-xs font-bold font-mono bg-danger px-2.5 py-0.5 rounded-full shadow border border-red-400/30">
                          {cam.detected} ({cam.confidence}%)
                        </span>
                      </div>
                    )}
                  </div>

                  {/* Camera status footer */}
                  <div className="p-3 bg-navy-900/90 border-t border-slate-900/60 flex items-center justify-between text-white text-[10px] relative z-10">
                    <span className="text-slate-400 font-mono">Zoom: 100% | Iris: Auto</span>
                    {cam.alert && aiDetectionOn ? (
                      <button 
                        onClick={() => setShowCctvModal(cam.id)}
                        className="bg-danger hover:bg-red-600 text-white font-extrabold px-3 py-1 rounded text-[9px] uppercase tracking-wider transition cursor-pointer shadow-sm"
                      >
                        Evaluate Incident
                      </button>
                    ) : (
                      <span className="text-slate-500">Scan status: Normal</span>
                    )}
                  </div>
                </div>
              ))}
            </div>

            {/* RIGHT SIDEBAR ACTIVE ALERTS */}
            <div className="bg-white border border-slate-100 rounded-3xl p-6 shadow-sm flex flex-col justify-between min-h-[460px]">
              <div>
                <div className="flex items-center justify-between mb-5 border-b border-slate-100 pb-3">
                  <h3 className="font-extrabold text-slate-800 text-base">Active Alerts Ledger</h3>
                  <span className="text-[10px] font-black bg-danger/10 text-danger border border-danger/20 px-2.5 py-0.5 rounded-full animate-pulse">
                    {activeAlertsList.length} Alerts Lock
                  </span>
                </div>

                <div className="space-y-4 max-h-[380px] overflow-y-auto pr-1">
                  {activeAlertsList.length === 0 ? (
                    <div className="text-center py-12 text-slate-400 text-xs">
                      <span className="text-2xl block mb-2">✓</span>
                      No active incident warnings detected by smart grid.
                    </div>
                  ) : (
                    activeAlertsList.map((alert) => (
                      <div 
                        key={alert.id}
                        className="border border-red-50 bg-red-50/5 rounded-2xl p-4 text-left relative overflow-hidden transition hover:border-danger/30 hover:bg-red-50/10 cursor-pointer"
                        onClick={() => setShowCctvModal(alert.id)}
                      >
                        <span className="text-[9px] font-mono font-bold text-slate-400 block">{alert.id} • {alert.location.split(" ")[0]}</span>
                        <h4 className="font-extrabold text-slate-800 text-sm mt-1">{alert.detected} detected</h4>
                        
                        {/* confidence bar */}
                        <div className="mt-3 space-y-1">
                          <div className="flex justify-between text-[9px] font-bold text-slate-500">
                            <span>Confidence Factor</span>
                            <span>{alert.confidence}%</span>
                          </div>
                          <div className="w-full bg-slate-100 rounded-full h-1.5">
                            <div className="bg-danger h-1.5 rounded-full" style={{ width: `${alert.confidence}%` }}></div>
                          </div>
                        </div>

                        <div className="flex items-center justify-between text-[10px] font-bold text-slate-400 mt-4 border-t border-slate-100/50 pt-2.5">
                          <span className="text-slate-500">{formatTimeElapsed(cctvAlertElapsed[alert.id] || 0)}</span>
                          <span className="text-success flex items-center gap-1">✓ Dispatch Triggered</span>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>

              {/* CCTV bottom legend */}
              <div className="border-t border-slate-100 pt-4 mt-4 grid grid-cols-2 gap-2.5 text-[9px] text-slate-400 font-semibold uppercase tracking-wider text-left">
                <div className="flex items-center gap-1.5"><span className="h-2 w-2 rounded-full bg-danger"></span> Vehicle Collision</div>
                <div className="flex items-center gap-1.5"><span className="h-2 w-2 rounded-full bg-danger"></span> Person Down / Fall</div>
                <div className="flex items-center gap-1.5"><span className="h-2 w-2 rounded-full bg-warning"></span> Smoke / Fire hazard</div>
                <div className="flex items-center gap-1.5"><span className="h-2 w-2 rounded-full bg-emerald-500"></span> Normal Scanning</div>
              </div>
            </div>
          </div>

          {/* ACTIVE CCTV ALERTS AUTO DISPATCH DETAILS MODAL */}
          {showCctvModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 overflow-y-auto">
              <div className="max-w-md w-full bg-white rounded-3xl shadow-2xl border border-slate-100 overflow-hidden relative text-left">
                <div className="p-5 border-b border-slate-100 flex items-center justify-between">
                  <div>
                    <h3 className="font-extrabold text-slate-800 text-base">CCTV Alert Evaluation</h3>
                    <p className="text-[10px] text-slate-400 font-mono mt-0.5">{showCctvModal} • System Priority Triage</p>
                  </div>
                  <button onClick={() => setShowCctvModal(null)} className="p-1 hover:bg-slate-100 rounded-lg transition" title="Close Panel">
                    <IconClose />
                  </button>
                </div>

                <div className="p-5 space-y-4">
                  {/* Camera feed mockup block */}
                  <div className="bg-navy-950 h-44 rounded-2xl relative flex items-center justify-center overflow-hidden border border-slate-800">
                    <div className="absolute top-2 left-2 bg-navy-900/80 border border-slate-800 px-2 py-0.5 rounded text-[8px] text-white font-mono">
                      SNAPSHOT LOCK — {showCctvModal}
                    </div>
                    {/* simple camera glyph */}
                    <div className="w-12 h-12 rounded-full bg-danger/25 border border-danger/35 flex items-center justify-center text-danger text-2xl font-bold animate-ping">
                      📸
                    </div>
                    <div className="absolute inset-0 bg-red-950/15 flex items-center justify-center">
                      <span className="text-white text-xs font-bold font-mono bg-danger px-3 py-1 rounded border border-red-400/40">
                        {cameras.find(c => c.id === showCctvModal)?.detected}
                      </span>
                    </div>
                  </div>

                  {/* Incident Stats details */}
                  <div className="space-y-3.5 border border-slate-100 bg-slate-50/50 rounded-2xl p-4 text-xs">
                    <div className="flex justify-between">
                      <span className="text-slate-400 font-semibold">Incident Node Location</span>
                      <strong className="text-slate-800">{cameras.find(c => c.id === showCctvModal)?.location}</strong>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400 font-semibold">Severity Rating Index</span>
                      <strong className="text-danger font-extrabold">9.0 / 10 Critical</strong>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400 font-semibold">AI Confidence Level</span>
                      <strong className="text-slate-800 font-extrabold">{cameras.find(c => c.id === showCctvModal)?.confidence}% Match</strong>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400 font-semibold">Auto-Response dispatch</span>
                      <span className="text-success font-bold flex items-center gap-1">✓ Complete</span>
                    </div>
                  </div>

                  <p className="text-[11px] text-slate-500 leading-relaxed italic bg-slate-50 p-3 rounded-xl border border-slate-100">
                    "AI surveillance system detected an anomaly on {cameras.find(c => c.id === showCctvModal)?.location}. Nearby responder AMB-09 dispatched auto-packet dispatch files."
                  </p>
                </div>

                <div className="p-5 border-t border-slate-100 flex gap-3">
                  <button 
                    disabled={showConfirmDispatchAlert}
                    onClick={handleConfirmAutoDispatch}
                    className="flex-1 bg-success hover:bg-emerald-600 text-white font-extrabold py-3.5 rounded-xl text-xs uppercase tracking-wider transition shadow cursor-pointer flex items-center justify-center gap-1.5"
                  >
                    {showConfirmDispatchAlert ? (
                      <span className="animate-pulse">Confirming...</span>
                    ) : (
                      "Confirm Auto-Dispatch"
                    )}
                  </button>
                  <button 
                    onClick={() => setShowCctvModal(null)}
                    className="flex-1 border border-slate-200 hover:bg-slate-50 text-slate-600 font-bold py-3.5 rounded-xl text-xs uppercase transition cursor-pointer text-center"
                  >
                    Dismiss Alert
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Mount React App
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<PulseRouteApp />);
  </script>
</body>

</html>
